name: Update storm data

# Keeps data/*.json (storm-history.html's hail, wind, and warning archive)
# current for the Apex service area — bbox 34.4-35.6N, -90.8--89.0W, set in
# tools/build-storm-data.mjs — without a backend or a build step on Netlify.
#
# This workflow commits straight to main, but that alone does not put new
# data on the live site: this repo has no Netlify GitHub integration, so
# nothing deploys automatically on push. Someone still has to run
# `tools/deploy.sh --prod` (or set up the GitHub integration — see README)
# to ship a commit this workflow made.
#
# Three schedules share one script — tools/build-storm-data.mjs decides what
# to do based on MODE, computed below from which cron fired:
#   09:00 UTC daily   full pass: SWDI backfill, Storm Events, LSR, CoCoRaHS,
#                     ASOS gusts.
#   every 4 hours     MRMS MESH + the NWS warnings poll only — both describe
#                     conditions that are only hours old and would be stale
#                     well before the next daily run otherwise.
#   10:00 UTC Monday  weekly-verify — runs verify-mesh-fixture.mjs and
#                     verify-wind-fixture.mjs (below) and commits a heartbeat.
#                     Touches no data/ files and runs no fetch against live
#                     sources beyond the two fixture dates those scripts
#                     check.
# verify-mesh-fixture and verify-wind-fixture also run standalone, on manual
# dispatch, for use right after touching the relevant parsing code — see
# their own entries below. Either way, what they catch: an ingest that
# fetches successfully but silently returns the wrong thing (a field
# renamed upstream, a decode regression) — a failure last_success alone
# cannot tell apart from a genuinely quiet stretch, because the fetch itself
# didn't error. These two scripts are the only thing on this page checking
# the *content* is still right, not just that a request succeeded, and
# weekly-verify is what makes that check run even when nobody remembers to.
#
# Attribution (NOAA open data terms require this be stated somewhere on the
# page — see the methodology note in storm-history.html, not just here):
# NOAA NCEI SWDI, NOAA MRMS via NOAA Open Data Dissemination, NWS Storm
# Events, NWS Local Storm Reports, NWS active alerts (api.weather.gov) — all
# NOAA/NWS. Iowa Environmental Mesonet mirrors LSR and provides ASOS/AWOS
# gust data. CoCoRaHS is an independent volunteer network.

on:
  schedule:
    - cron: "0 9 * * *"    # daily — see MODE below
    - cron: "0 */4 * * *"  # frequent — MRMS MESH + warnings only
    - cron: "0 10 * * 1"   # weekly-verify — Monday, an hour after the daily run
  workflow_dispatch:
    inputs:
      mode:
        description: "Which pass to run"
        type: choice
        options: [daily, frequent, weekly-verify, verify-mesh-fixture, verify-wind-fixture]
        default: daily

# No API keys are configured here because none are needed: every source
# (NOAA NCEI SWDI, NOAA MRMS/NODD, NWS Storm Events and active alerts, Iowa
# Environmental Mesonet, CoCoRaHS) is free and keyless. If a future source
# needs one, add it as a repository secret (Settings > Secrets and variables
# > Actions) and reference it as ${{ secrets.NAME }} in an env: block below —
# never inline the value here.

permissions:
  contents: write

# A cron run and a manual run landing at the same time would race to push;
# this serializes them instead of letting the second fail on a stale ref.
concurrency:
  group: update-storm-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # eccodeslib (the compiled decoder eccodes wraps) ships manylinux
      # wheels for cp310-cp314 — pinning 3.11 here guarantees a wheel install
      # on ubuntu-latest, no compiling from source. Confirmed against PyPI's
      # file listing for eccodeslib; not yet confirmed on an actual Actions
      # runner, which is exactly what the verify-mesh-fixture dispatch mode
      # below is for.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No continue-on-error: a missing decoder is not an optional-layer
      # problem to shrug off, it's the exact failure mode this workflow
      # exists to catch loudly (see MAKE ZERO LOUD, NOT SILENT in the PR that
      # added this comment) — tools/build-storm-data.mjs's own hasEccodes()
      # check will hard-fail the run either way, but failing here first
      # gives a clearer error than tracing it through the generator's log.
      - name: Install eccodes (MRMS GRIB2 decoding)
        id: eccodes
        run: pip install eccodes

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * 1" ]; then
            echo "mode=weekly-verify" >> "$GITHUB_OUTPUT"
          else
            echo "mode=frequent" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify MESH decoding against known fixture
        if: steps.mode.outputs.mode == 'verify-mesh-fixture' || steps.mode.outputs.mode == 'weekly-verify'
        run: node tools/verify-mesh-fixture.mjs

      - name: Verify LSR wind parsing against known fixture
        if: steps.mode.outputs.mode == 'verify-wind-fixture' || steps.mode.outputs.mode == 'weekly-verify'
        run: node tools/verify-wind-fixture.mjs

      # GitHub auto-disables a scheduled workflow after 60 days with no
      # repository activity — and a *run* of the schedule doesn't count as
      # activity, only an actual commit does (confirmed: this is exactly
      # what community "keepalive" Actions exist to work around). The storm
      # job only commits when new data shows up, so a long quiet stretch
      # with nothing to report — like the one this archive is in right now —
      # is also a long stretch with no commits, right up until the schedule
      # itself silently dies with no warning. This commits every week
      # regardless, specifically to keep the lights on. Runs with always()
      # so it still happens even if one of the two verify steps above just
      # failed — losing the schedule in the middle of an actual problem,
      # the one time it matters most, is the exact failure this exists to
      # prevent.
      - name: Record a heartbeat (keeps the schedule itself alive)
        if: always() && steps.mode.outputs.mode == 'weekly-verify'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-verified
          git add .github/last-verified
          if git diff --cached --quiet; then
            echo "Heartbeat unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "Weekly verify heartbeat ($(date -u +%F))"
          git push

      - name: Regenerate storm data
        id: regenerate
        # steps.eccodes.outcome == 'success' is explicit, not implied: this
        # if: already replaces the default success()-only gate (any custom
        # if: does), so without that clause, a failed eccodes install would
        # not stop this step from running — build-storm-data.mjs's own
        # hasEccodes() check would likely catch a wholly-missing install and
        # refuse to write anyway, but that's a second-hand inference, not
        # something this workflow asserts for itself, and it wouldn't catch
        # a partial install that imports but decodes wrong.
        if: >
          steps.mode.outputs.mode != 'verify-mesh-fixture' &&
          steps.mode.outputs.mode != 'verify-wind-fixture' &&
          steps.mode.outputs.mode != 'weekly-verify' &&
          steps.eccodes.outcome == 'success'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          # Incremental in both modes: refetches the last 2 calendar months
          # and merges into the committed archive, instead of a full 10-year
          # rebuild. Required in frequent mode specifically — the generator
          # refuses to run frequent without it (see build-storm-data.mjs).
          # The generator fails the step rather than writing partial data if
          # a source comes back empty after retries, so there's nothing
          # further to check here.
          WINDOW_MONTHS: 2
        run: node tools/build-storm-data.mjs data

      - name: Commit if changed
        id: commit
        # Same reasoning as Regenerate storm data above — this if: already
        # replaces the default gate, so the eccodes check has to be
        # repeated here explicitly rather than inherited.
        if: >
          steps.mode.outputs.mode != 'verify-mesh-fixture' &&
          steps.mode.outputs.mode != 'verify-wind-fixture' &&
          steps.mode.outputs.mode != 'weekly-verify' &&
          steps.eccodes.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No storm data changes — nothing to commit."
            exit 0
          fi
          git add data/
          git commit -m "Update storm data (${{ steps.mode.outputs.mode }}, $(date -u +%F))"
          git push

      # Threshold is 2 missed consecutive daily runs, not STALE_DAYS (4) from
      # storm-history.js — that number is calibrated for a homeowner's
      # tolerance for "no storms"; this one is calibrated for "someone should
      # look at this soon". Runs via always() so it still fires even when
      # "Regenerate storm data" above failed and exited before writing
      # anything — in that case data/storm-index.json on disk is still
      # whatever the last successful run committed, which is exactly the
      # value this needs to read. wind.last_success and mesh.last_success
      # both advance on every successful run regardless of mode (daily and
      # frequent alike — see build-storm-data.mjs), so either one sitting
      # more than 2 days behind today means real, repeated failures, not one
      # bad run — a single transient failure already won't trip this, and
      # already got its own GitHub failure email as whichever step it broke.
      - name: Fail loudly if the pipeline has gone quiet
        if: always() && steps.mode.outputs.mode == 'daily'
        run: |
          node -e '
            const fs = require("fs");
            const idx = JSON.parse(fs.readFileSync("data/storm-index.json", "utf8"));
            const daysSince = (iso) => iso
              ? Math.floor((Date.now() - new Date(iso + "T00:00:00Z").getTime()) / 86400000)
              : Infinity;
            const meshDays = daysSince(idx.mesh && idx.mesh.last_success);
            const windDays = daysSince(idx.wind && idx.wind.last_success);
            const worst = Math.max(meshDays, windDays);
            console.log(`mesh.last_success is ${meshDays} day(s) old, wind.last_success is ${windDays} day(s) old`);
            if (worst > 2) {
              console.error(`Pipeline has not completed successfully in ${worst} day(s) — see data/storm-index.json`);
              process.exit(1);
            }
          '

      # External dead man's switch (healthchecks.io) — answers only "did the
      # scheduler run today", deliberately independent of the staleness
      # check above and everything else past this point. Routes on
      # eccodes/regenerate/commit's own outcomes specifically, not success()
      # or the job's overall conclusion, which would also fold in the
      # staleness check — a quiet season with nothing to report (the one
      # this archive is in right now) must not look like a dead cron. Each
      # step guards on PING_URL being set so this is safe to ship before the
      # secret exists — a no-op, not a failing step, until it does.
      - name: Ping healthcheck — scheduler ran, fetch succeeded
        if: >
          always() && steps.mode.outputs.mode == 'daily' &&
          steps.eccodes.outcome == 'success' &&
          steps.regenerate.outcome == 'success' &&
          steps.commit.outcome == 'success'
        env:
          PING_URL: ${{ secrets.STORM_HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "STORM_HEALTHCHECK_PING_URL not set yet — skipping ping."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$PING_URL"

      - name: Ping healthcheck /fail — something actually broke
        if: >
          always() && steps.mode.outputs.mode == 'daily' &&
          (steps.eccodes.outcome == 'failure' ||
          steps.regenerate.outcome == 'failure' ||
          steps.commit.outcome == 'failure')
        env:
          PING_URL: ${{ secrets.STORM_HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "STORM_HEALTHCHECK_PING_URL not set yet — skipping ping."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$PING_URL/fail"
